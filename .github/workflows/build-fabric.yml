name: Build Fabric Mod

on:
  push:
    branches:
      - copilot/build-minecraft-mod-fabric-1-21-10
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build Fabric distribution
        run: ./gradlew :fabric:createDist --stacktrace --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fabric-dist
          path: |
            dist/*.jar
            dist/checksums.txt
            fabric/build/libs/*.jar
